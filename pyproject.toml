[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dronelytics"
version = "1.0.4"
description = "Comprehensive Python package for drone orthomosaic analysis and agricultural field phenotyping"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

authors = [
    {name = "Lalit BC", email = "lalitiaas@gmail.com"}
]

dependencies = [
    "numpy",
    "rasterio",
    "matplotlib",
    "scipy",
    "pandas",
    "scikit-image",      
    "geopandas",        
    "shapely",           
    "openpyxl"
]

[project.optional-dependencies]
pointcloud = [
    "laspy",
    "pyvista"
]
